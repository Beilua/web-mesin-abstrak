<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Simulasi Mesin Abstrak</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="brand">
    <div class="brand-tulisan">
      <h1>> Mesin Abstrak</h1>
    </div>
  </div>
  <nav class="tablist" role="tablist" aria-label="Pilih mesin">
    <button id="tab-karakter" role="tab" aria-selected="true" class="tab aktif">Mesin Karakter</button>
    <button id="tab-kata" role="tab" aria-selected="false" class="tab">Mesin Kata</button>
  </nav>
</header>

<main class="tata">
  <section class="kolom-kode kartu" aria-label="Kode mesin C">
    <h2 class="judul-kartu">Kode Program</h2>
    <div id="kode" class="kode"></div>
  </section>

  <section class="mesin-kartu kartu" aria-label="Mesin abstrak">
    <h2 class="judul-kartu">Mesin Karakter</h2>
    <p class="petunjuk">Klik kertas (pita) untuk mengubah isinya.</p>
    <div id="pita" class="pita" role="button" tabindex="0" aria-label="Pita mesin, klik untuk mengubah"></div>
    <div id="tombol-mesin" class="tombol-mesin"></div>
  </section>

  <section class="kolom-var kartu" aria-label="Panel variabel">
    <h2 class="judul-kartu">Variabel</h2>
    <div id="panel-var" class="panel-var"></div>
  </section>
</main>

<section class="kartu kartu-penjelasan" aria-label="Penjelasan langkah">
  <h2 class="judul-kartu">Penjelasan &amp; Log</h2>
  <div class="penjelasan-barnas">
    <span class="ikon-log">i</span>
    <p id="penjelasan" class="penjelasan" aria-live="polite">Tekan START untuk menyalakan mesin.</p>
  </div>
</section>

<dialog id="dialog-pita" class="dialog-pita">
  <form method="dialog" class="form-pita">
    <h2>Ubah Pita</h2>
    <label for="pita-input">Pita</label>
    <textarea id="pita-input" rows="2" spellcheck="false"></textarea>
    <div class="baris-eop">
      <label for="eop-input">EOP</label>
      <input type="text" id="eop-input" value="." maxlength="1" spellcheck="false">
      <output id="pita-hitung" class="pita-hitung" for="pita-input">0/149</output>
    </div>
    <p id="pesan-galat" class="galat" hidden role="alert"></p>
    <div class="baris-aksi">
      <button type="button" id="btn-batal" class="btn">Batal</button>
      <button type="button" id="btn-terapkan" class="btn primer">Terapkan</button>
    </div>
  </form>
</dialog>

<script src="js/mesin.js"></script>
<script src="js/kode.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
